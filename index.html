<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALEESHA 🌌</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at 20% 20%, #0a0a2a, #000010);
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<script>
const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let W = canvas.width, H = canvas.height;

const stars = [];
const fireworks = [];
const texts = ["ALEESHY", "CUTIEEE"];  // ✅ Two lines

// Offscreen canvas for text
const off = document.createElement("canvas");
const offCtx = off.getContext("2d");
off.width = W;
off.height = H;

function createTextPoints() {
  offCtx.clearRect(0, 0, off.width, off.height);
  offCtx.textAlign = "center";
  offCtx.fillStyle = "white";

  let points = [];
  let fontSize = Math.floor(H/6);

  texts.forEach((txt, i) => {
    offCtx.font = "bold " + fontSize + "px Arial";
    let yPos = (H/2 - fontSize) + i * (fontSize + 60); // spacing between lines
    offCtx.fillText(txt, off.width/2, yPos);

    const imageData = offCtx.getImageData(0, 0, off.width, off.height);
    for (let y = 0; y < off.height; y += 6) {
      for (let x = 0; x < off.width; x += 6) {
        const idx = (y * off.width + x) * 4;
        if (imageData.data[idx+3] > 128) {
          points.push({x, y});
        }
      }
    }
  });

  return points;
}

const targets = createTextPoints();

// Star class
class Star {
  constructor(tx, ty) {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.tx = tx;
    this.ty = ty;
    this.size = Math.random()*1.5+0.5;
    this.alpha = 0;
  }
  update() {
    this.x += (this.tx - this.x) * 0.03;
    this.y += (this.ty - this.y) * 0.03;
    if (this.alpha < 1) this.alpha += 0.02;
  }
  draw() {
    ctx.globalAlpha = this.alpha * (0.5 + 0.5*Math.sin(Date.now()/300 + this.tx));
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
  }
}

// Firework particle
class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.radius = Math.random() * 2 + 1;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = Math.random() * 4 + 1;
    this.alpha = 1;
    this.decay = Math.random() * 0.02 + 0.01;
  }
  update() {
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    this.alpha -= this.decay;
  }
  draw() {
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
    ctx.fill();
  }
}

// Firework burst
function createFirework() {
  const x = Math.random() * W;
  const y = Math.random() * H/2;
  const colors = ["#ff4b5c", "#ffd700", "#00d9ff", "#ff69b4", "#adff2f"];
  const color = colors[Math.floor(Math.random()*colors.length)];
  for (let i=0; i<50; i++) {
    fireworks.push(new Particle(x, y, color));
  }
}

for (let t of targets) stars.push(new Star(t.x, t.y));

// Animation loop
function animate() {
  ctx.fillStyle = "rgba(0,0,20,0.3)";
  ctx.fillRect(0, 0, W, H);

  for (let s of stars) {
    s.update();
    s.draw();
  }

  for (let i = fireworks.length-1; i >= 0; i--) {
    let f = fireworks[i];
    f.update();
    f.draw();
    if (f.alpha <= 0) fireworks.splice(i,1);
  }

  if (Math.random() < 0.02) createFirework(); // fireworks occasionally

  requestAnimationFrame(animate);
}
animate();

window.onresize = () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  W = canvas.width; H = canvas.height;
};
</script>
</body>
</html>
